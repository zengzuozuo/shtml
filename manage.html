<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>合约黑名单管理</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
    --success: #16a34a;
    --error: #dc2626;
    --info: #2563eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .card h2 { font-size: 15px; margin: 0; }
  .card .hint { color: var(--muted); font-size: 12px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  input[type="text"], textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); }
  button {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { background: #9ca3af; cursor: not-allowed; }
  button.secondary { background: #fff; color: var(--primary); border: 1px solid var(--primary); }
  button.secondary:hover { background: #eff6ff; }
  #accountInfo, #contractInfo, #queryResult {
    font-size: 13px;
    color: var(--muted);
    word-break: break-all;
  }
  .status {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 4px;
    display: none;
  }
  .status.show { display: block; }
  .status.info { background: #eff6ff; color: var(--info); }
  .status.success { background: #f0fdf4; color: var(--success); }
  .status.error { background: #fef2f2; color: var(--error); }
  .status a { color: inherit; font-weight: 600; }
</style>
</head>
<body>
  <div class="container">
    <h1>合约黑名单管理</h1>
    <p class="subtitle">连接 MetaMask 后，对指定合约执行添加 / 移除黑名单操作</p>

    <section class="card">
      <h2>1. 连接钱包</h2>
      <div class="row">
        <button id="connectBtn">连接 MetaMask</button>
        <span id="accountInfo">未连接</span>
      </div>
      <div class="hint">写操作（添加/移除黑名单）会消耗 gas，需在 MetaMask 弹窗中确认授权。</div>
    </section>

    <section class="card">
      <h2>2. 合约地址</h2>
      <input id="contractAddress" type="text" placeholder="0x...（目标合约地址）" />
      <div id="contractInfo"></div>
    </section>

    <section class="card">
      <h2>3. 添加黑名单</h2>
      <textarea id="addInput" rows="3" placeholder="多个地址用逗号 / 空格 / 换行分隔，例如：&#10;0x111..., 0x222..."></textarea>
      <div class="row">
        <button id="addBtn">添加黑名单</button>
      </div>
      <div class="hint">被拉黑的地址将无法转出代币（仍可接收）。</div>
    </section>

    <section class="card">
      <h2>4. 移除黑名单</h2>
      <textarea id="removeInput" rows="3" placeholder="多个地址用逗号 / 空格 / 换行分隔"></textarea>
      <div class="row">
        <button id="removeBtn">移除黑名单</button>
      </div>
    </section>

    <section class="card">
      <h2>5. 查询黑名单状态</h2>
      <div class="row">
        <input id="queryInput" type="text" placeholder="单个地址 0x..." style="flex:1;" />
        <button id="queryBtn" class="secondary">查询</button>
      </div>
      <div id="queryResult"></div>
    </section>

    <div id="status" class="status"></div>
  </div>

<script>
// ===== 合约 ABI（与 abi.json 一致） =====
const ABI = [
  { inputs: [], stateMutability: "nonpayable", type: "constructor" },
  { inputs: [{ internalType: "address", name: "spender", type: "address" }, { internalType: "uint256", name: "allowance", type: "uint256" }, { internalType: "uint256", name: "needed", type: "uint256" }], name: "ERC20InsufficientAllowance", type: "error" },
  { inputs: [{ internalType: "address", name: "sender", type: "address" }, { internalType: "uint256", name: "balance", type: "uint256" }, { internalType: "uint256", name: "needed", type: "uint256" }], name: "ERC20InsufficientBalance", type: "error" },
  { inputs: [{ internalType: "address", name: "approver", type: "address" }], name: "ERC20InvalidApprover", type: "error" },
  { inputs: [{ internalType: "address", name: "receiver", type: "address" }], name: "ERC20InvalidReceiver", type: "error" },
  { inputs: [{ internalType: "address", name: "sender", type: "address" }], name: "ERC20InvalidSender", type: "error" },
  { inputs: [{ internalType: "address", name: "spender", type: "address" }], name: "ERC20InvalidSpender", type: "error" },
  { anonymous: false, inputs: [{ indexed: true, internalType: "address", name: "owner", type: "address" }, { indexed: true, internalType: "address", name: "spender", type: "address" }, { indexed: false, internalType: "uint256", name: "value", type: "uint256" }], name: "Approval", type: "event" },
  { anonymous: false, inputs: [{ indexed: true, internalType: "address", name: "account", type: "address" }], name: "Blacklisted", type: "event" },
  { anonymous: false, inputs: [{ indexed: true, internalType: "address", name: "from", type: "address" }, { indexed: true, internalType: "address", name: "to", type: "address" }, { indexed: false, internalType: "uint256", name: "value", type: "uint256" }], name: "Transfer", type: "event" },
  { anonymous: false, inputs: [{ indexed: true, internalType: "address", name: "account", type: "address" }], name: "Unblacklisted", type: "event" },
  { inputs: [{ internalType: "address[]", name: "accounts", type: "address[]" }], name: "addToBlacklist", outputs: [], stateMutability: "nonpayable", type: "function" },
  { inputs: [{ internalType: "address", name: "owner", type: "address" }, { internalType: "address", name: "spender", type: "address" }], name: "allowance", outputs: [{ internalType: "uint256", name: "", type: "uint256" }], stateMutability: "view", type: "function" },
  { inputs: [{ internalType: "address", name: "spender", type: "address" }, { internalType: "uint256", name: "value", type: "uint256" }], name: "approve", outputs: [{ internalType: "bool", name: "", type: "bool" }], stateMutability: "nonpayable", type: "function" },
  { inputs: [{ internalType: "address", name: "account", type: "address" }], name: "balanceOf", outputs: [{ internalType: "uint256", name: "", type: "uint256" }], stateMutability: "view", type: "function" },
  { inputs: [{ internalType: "address", name: "", type: "address" }], name: "blacklist", outputs: [{ internalType: "bool", name: "", type: "bool" }], stateMutability: "view", type: "function" },
  { inputs: [], name: "decimals", outputs: [{ internalType: "uint8", name: "", type: "uint8" }], stateMutability: "view", type: "function" },
  { inputs: [], name: "name", outputs: [{ internalType: "string", name: "", type: "string" }], stateMutability: "view", type: "function" },
  { inputs: [], name: "owner", outputs: [{ internalType: "address", name: "", type: "address" }], stateMutability: "view", type: "function" },
  { inputs: [{ internalType: "address[]", name: "accounts", type: "address[]" }], name: "removeFromBlacklist", outputs: [], stateMutability: "nonpayable", type: "function" },
  { inputs: [], name: "symbol", outputs: [{ internalType: "string", name: "", type: "string" }], stateMutability: "view", type: "function" },
  { inputs: [], name: "totalSupply", outputs: [{ internalType: "uint256", name: "", type: "uint256" }], stateMutability: "view", type: "function" },
  { inputs: [{ internalType: "address", name: "recipient", type: "address" }, { internalType: "uint256", name: "amount", type: "uint256" }], name: "transfer", outputs: [{ internalType: "bool", name: "", type: "bool" }], stateMutability: "nonpayable", type: "function" },
  { inputs: [{ internalType: "address", name: "sender", type: "address" }, { internalType: "address", name: "recipient", type: "address" }, { internalType: "uint256", name: "amount", type: "uint256" }], name: "transferFrom", outputs: [{ internalType: "bool", name: "", type: "bool" }], stateMutability: "nonpayable", type: "function" }
];

// ===== 网络名称与区块浏览器 =====
const NETWORK_NAMES = {
  1: "Ethereum 主网",
  5: "Goerli 测试网",
  56: "BSC 主网",
  97: "BSC 测试网",
  137: "Polygon 主网",
  11155111: "Sepolia 测试网"
};
const EXPLORERS = {
  1: "https://etherscan.io/tx/",
  5: "https://goerli.etherscan.io/tx/",
  56: "https://bscscan.com/tx/",
  97: "https://testnet.bscscan.com/tx/",
  137: "https://polygonscan.com/tx/",
  11155111: "https://sepolia.etherscan.io/tx/"
};

let provider = null;
let signer = null;
let account = null;
let currentChainId = null;

const $ = (id) => document.getElementById(id);

function short(addr) {
  return addr ? addr.slice(0, 6) + "..." + addr.slice(-4) : "";
}

function networkName(id) {
  return NETWORK_NAMES[id] || "未知网络";
}

function showStatus(msg, type, hash) {
  const el = $("status");
  el.className = "status show " + (type || "info");
  let html = msg;
  if (hash && EXPLORERS[currentChainId]) {
    html += ' <a href="' + EXPLORERS[currentChainId] + hash + '" target="_blank" rel="noopener">查看交易</a>';
  }
  el.innerHTML = html;
}

function setBusy(btn, busy) {
  if (busy) {
    btn.dataset.text = btn.textContent;
    btn.textContent = "处理中...";
    btn.disabled = true;
  } else {
    btn.textContent = btn.dataset.text || btn.textContent;
    btn.disabled = false;
  }
}

async function setupProvider() {
  provider = new ethers.BrowserProvider(window.ethereum);
  signer = await provider.getSigner();
  account = await signer.getAddress();
  const network = await provider.getNetwork();
  currentChainId = Number(network.chainId);
  $("accountInfo").textContent = short(account) + " | " + networkName(currentChainId) + " (chainId: " + currentChainId + ")";
  $("connectBtn").textContent = "已连接";
}

async function connect() {
  if (!window.ethereum) {
    showStatus("未检测到 MetaMask，请先安装插件", "error");
    return;
  }
  try {
    await window.ethereum.request({ method: "eth_requestAccounts" });
    await setupProvider();
    showStatus("钱包连接成功", "success");
    verifyContract();
  } catch (e) {
    showStatus("连接失败：" + (e.message || e), "error");
  }
}

async function handleAccountsChanged(accounts) {
  if (!accounts || accounts.length === 0) {
    account = null;
    signer = null;
    $("accountInfo").textContent = "未连接";
    $("connectBtn").textContent = "连接 MetaMask";
  } else {
    await setupProvider();
  }
}

function getContract() {
  if (!signer) throw new Error("请先连接 MetaMask");
  const addr = $("contractAddress").value.trim();
  if (!ethers.isAddress(addr)) throw new Error("合约地址格式错误");
  return new ethers.Contract(addr, ABI, signer);
}

// 解析多地址输入（逗号 / 空格 / 换行 / 分号分隔）
function parseAddresses(text) {
  const list = text.split(/[\s,;]+/).map((s) => s.trim()).filter(Boolean);
  for (const a of list) {
    if (!ethers.isAddress(a)) throw new Error("地址格式错误：" + a);
  }
  return list;
}

// 输入合约地址后自动读取 name/symbol/owner 校验
async function verifyContract() {
  const el = $("contractInfo");
  el.textContent = "";
  const addr = $("contractAddress").value.trim();
  if (!provider || !ethers.isAddress(addr)) return;
  try {
    const c = new ethers.Contract(addr, ABI, provider);
    const [name, symbol, owner] = await Promise.all([c.name(), c.symbol(), c.owner()]);
    el.textContent = "合约：" + name + " (" + symbol + ") | owner: " + owner;
  } catch (e) {
    el.textContent = "无法读取合约信息，请确认地址与当前网络";
  }
}

async function addBlacklist() {
  try {
    const contract = getContract();
    const list = parseAddresses($("addInput").value);
    if (list.length === 0) throw new Error("请输入至少一个地址");
    setBusy($("addBtn"), true);
    showStatus("准备添加 " + list.length + " 个地址，请在 MetaMask 中确认 gas 费...", "info");
    const tx = await contract.addToBlacklist(list);
    showStatus("交易已广播（" + short(tx.hash) + "），等待确认...", "info");
    await tx.wait();
    showStatus("添加成功，共 " + list.length + " 个地址。", "success", tx.hash);
  } catch (e) {
    showStatus("操作失败：" + (e.reason || e.message || e), "error");
  } finally {
    setBusy($("addBtn"), false);
  }
}

async function removeBlacklist() {
  try {
    const contract = getContract();
    const list = parseAddresses($("removeInput").value);
    if (list.length === 0) throw new Error("请输入至少一个地址");
    setBusy($("removeBtn"), true);
    showStatus("准备移除 " + list.length + " 个地址，请在 MetaMask 中确认 gas 费...", "info");
    const tx = await contract.removeFromBlacklist(list);
    showStatus("交易已广播（" + short(tx.hash) + "），等待确认...", "info");
    await tx.wait();
    showStatus("移除成功，共 " + list.length + " 个地址。", "success", tx.hash);
  } catch (e) {
    showStatus("操作失败：" + (e.reason || e.message || e), "error");
  } finally {
    setBusy($("removeBtn"), false);
  }
}

async function queryBlacklist() {
  const el = $("queryResult");
  try {
    const contract = getContract();
    const addr = $("queryInput").value.trim();
    if (!ethers.isAddress(addr)) throw new Error("地址格式错误");
    const res = await contract.blacklist(addr);
    el.textContent = addr + " → " + (res ? "已在黑名单" : "不在黑名单");
  } catch (e) {
    el.textContent = "查询失败：" + (e.message || e);
  }
}

// ===== 事件绑定 =====
$("connectBtn").addEventListener("click", connect);
$("addBtn").addEventListener("click", addBlacklist);
$("removeBtn").addEventListener("click", removeBlacklist);
$("queryBtn").addEventListener("click", queryBlacklist);
$("contractAddress").addEventListener("blur", verifyContract);

// 页面加载时若已授权则自动连接
if (window.ethereum) {
  window.ethereum.on("accountsChanged", handleAccountsChanged);
  window.ethereum.on("chainChanged", () => location.reload());
  window.ethereum.request({ method: "eth_accounts" }).then((accounts) => {
    if (accounts && accounts.length > 0) setupProvider();
  }).catch(() => {});
} else {
  $("accountInfo").textContent = "未检测到 MetaMask，请安装插件";
}
</script>
</body>
</html>
